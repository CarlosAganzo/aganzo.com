name: Rebuild HQ profile portrait

on:
  push:
    paths:
      - ".github/workflows/rebuild-hq-portrait.yml"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild WebP
        run: |
          cat \
            portrait-field-upload/0.txt \
            portrait-field-upload/0b0.txt portrait-field-upload/0b1.txt portrait-field-upload/0b2.txt portrait-field-upload/0b3.txt \
            portrait-field-upload/1.txt \
            portrait-field-upload/1b0.txt portrait-field-upload/1b1.txt portrait-field-upload/1b2.txt portrait-field-upload/1b3.txt portrait-field-upload/1b4.txt \
            portrait-field-upload/2.txt \
            portrait-field-upload/2b0.txt portrait-field-upload/2b1.txt portrait-field-upload/2b2.txt portrait-field-upload/2b3.txt portrait-field-upload/2b4.txt \
            portrait-field-upload/3a.txt portrait-field-upload/3b.txt portrait-field-upload/3c.txt portrait-field-upload/3d.txt portrait-field-upload/3e.txt portrait-field-upload/3f.txt \
            portrait-field-upload/4a0.txt portrait-field-upload/4a1.txt portrait-field-upload/4b.txt portrait-field-upload/4c.txt portrait-field-upload/4d.txt portrait-field-upload/4e.txt portrait-field-upload/4f.txt \
            | base64 -d > portrait-field-hq.webp
          test "$(stat -c%s portrait-field-hq.webp)" -eq 109178
          echo "41657374f3f25fa341eb63fc050803a66602e5238737a9eab1f8bddf4bc8c29a  portrait-field-hq.webp" | sha256sum -c -

      - name: Point carousel at HQ image
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text()
          old = 'src="portrait-field.jpg" alt="Carlos Aganzo outdoors in a harvested field"'
          new = 'src="portrait-field-hq.webp" alt="Carlos Aganzo outdoors in a harvested field"'
          if old not in s:
              raise SystemExit("Expected portrait source not found")
          p.write_text(s.replace(old, new))
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portrait-field-hq.webp index.html
          git commit -m "Use high-resolution third profile portrait"
          git push
