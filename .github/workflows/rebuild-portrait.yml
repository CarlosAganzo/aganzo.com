name: Rebuild high-quality portrait

on:
  push:
    paths:
      - ".github/workflows/rebuild-portrait.yml"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Rebuild JPEG from stored chunks
        shell: python
        run: |
          import base64
          from io import BytesIO
          from pathlib import Path
          from PIL import Image

          folder = Path("portrait-field-data")
          bad = (folder / "a0.txt").read_text().strip()
          rest = "".join((folder / name).read_text().strip() for name in [
              "a1.txt", "a2.txt", "a3.txt", "2.txt", "3.txt", "4.txt", "5.txt"
          ])

          if len(bad) != 3254:
              raise SystemExit(f"Unexpected a0 length: {len(bad)}")

          found = None
          for i in range(len(bad) - 3):
              candidate = bad[:i] + bad[i+4:] + rest
              try:
                  data = base64.b64decode(candidate, validate=True)
                  image = Image.open(BytesIO(data))
                  image.load()
                  if image.format == "JPEG" and image.size == (400, 500):
                      found = (i, data)
                      break
              except Exception:
                  pass

          if found is None:
              raise SystemExit("Could not reconstruct a valid 400x500 JPEG")

          pos, data = found
          Path("portrait-field.jpg").write_bytes(data)
          print(f"Recovered portrait by removing 4 extra base64 chars at offset {pos}")
          print(f"Wrote {len(data)} bytes")

      - name: Commit rebuilt image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portrait-field.jpg
          if git diff --cached --quiet; then
            echo "No image change to commit"
          else
            git commit -m "Rebuild high-quality third portrait"
            git push
          fi
